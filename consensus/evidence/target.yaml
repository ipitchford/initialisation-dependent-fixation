strengthened_claims:
  - id: compact_resident_strict_bias
    exact_statement: |
      Let F be a nondegenerate probability law on [b_minus,b_plus], with
      0<a<b_minus<=b_plus<infinity, lambda=(E_F[1/R])^{-1}, and
      mu(dr)=lambda F(dr)/r. For the bounded reversible reset generator
      Lf(r)=r(int f dF-f(r)), the fresh resident intensity satisfies
      b_F(t)-lambda=<R-lambda,exp(tL)(R-lambda)>_{L2(mu)}/lambda>0
      at every finite t>=0. Consequently c_F>1-a/lambda.
    novelty_boundary: 'Renewal monotonicity is classical; the claim is its consequence for the corrected source-model fixation limit.'
  - id: sharp_fixed_harmonic_mean_envelope
    exact_statement: |
      Fix 0<a<b<lambda. Over all compactly supported resident-rate laws F
      on [b,infinity) with (E_F[1/R])^{-1}=lambda, and fresh initialisation,
      sup_F c_F=(lambda-a)/(lambda-a+a exp(-(lambda/b-1))).
      The supremum is approached by F_R=p_R delta_b+(1-p_R)delta_R,
      R>lambda tending to infinity, where
      p_R=b(R-lambda)/(lambda(R-b)).
      It is not attained by a finite-rate law with harmonic mean lambda>b.
    invariants:
      renewal_excess: 'D=int_0^infinity(b_F(t)-lambda)dt=E_F[R^{-2}]/(E_F[R^{-1}])^2-1'
      moment_bound: 'D<=lambda/b-1'
      branching_functional_bound: 'c_F<=(lambda-a)/(lambda-a+a exp(-D))'
    novelty_boundary: 'The renewal excess identity and moment inequality are classical in form; the sharp fixation functional and extremising source-model family were not found in the recorded bounded search.'
  - id: finite_upper_support_bound
    exact_statement: |
      If additionally F is supported on [b,B], a<b<=lambda<=B<infinity,
      then D<=(lambda-b)(B-lambda)/(b B), hence
      c_F<=(lambda-a)/(lambda-a+a exp(-(lambda-b)(B-lambda)/(b B))).
    novelty_boundary: 'The moment bound is elementary and sharp for its moment problem; the fixation bound is not asserted sharp for fixed finite B.'
  - id: sharp_global_single_founder_error
    exact_statement: |
      Over the constant-favourable-rate, compact resident-rate class with
      separated supports, the supremum of the asymptotic fresh fixation
      error c_F-(1-a/lambda) is max_{t>0} g(t), where
      g(t)=t/(t+exp(-t))-t/(1+t).
      The positive maximiser is unique. It lies strictly between
      1.71891151345837 and 1.71891151345839, and the maximal error lies
      strictly between 0.273355434321512683887747078798 and
      0.273355434321518094791934130376.
      This is an asymptotic single-founder supremum, approached by a
      sequence of finite two-rate models; it is not a finite-N bound.
    certificate: '../certified_limits.json'
  - id: pre_ageing
    exact_statement: |
      Initialise resident rates with F exp(tau L) for tau>=0.
      For nondegenerate F, c_tau strictly decreases to 1-a/lambda.
      If b=min support(F)>a and D is the full fresh renewal excess, then
      0<c_tau-(1-a/lambda)<=D exp(-b tau)/4.
    novelty_boundary: 'A consequence of the identified fixation functional and a reversible spectral gap; no independent novelty claim for semigroup decay.'
  - id: finite_favourable_type_extension
    exact_statement: |
      Let favourable rates a_i>0 form a finite family, with redraw
      probabilities p_i and initial type probabilities nu_A,i, and let
      max_i a_i<b_minus. Let resident reset and initial laws F,nu be compactly
      supported on [b_minus,b_plus]. For each terminal time T and s<=T,
      let q_i^(T)(s) be the backward extinction probabilities solving
      dq_i/ds=a_i(q_i-1)+b_nu(s)q_i(1-sum_j p_j q_j),
      with q_i^(T)(T)=0. Let q_i(s)=lim_{T->infinity}q_i^(T)(s).
      Then, from fixed k independently typed favourable founders,
      lim_{N->infinity}alpha_k(N;nu,nu_A)
      =1-(sum_i nu_A,i q_i(0))^k.
      Under resident equilibrium, q_i=a_i/(a_i+lambda c) and
      c=sum_i p_i lambda c/(a_i+lambda c), recovering the stationary
      branching fixed point with the additional equilibrium initialisation.
    exclusions: ['No overlapping-support claim', 'No arbitrary continuous favourable-type theorem is claimed']
  - id: strict_fresh_bias_for_finite_favourable_types
    exact_statement: |
      Under the finite favourable-type extension and nondegenerate F,
      every fixed k>=1 and common initial favourable-type law nu_A have
      strictly greater limiting fixation with fresh residents than with
      equilibrium residents. For each initial type i and every T>0, put
      d(t)=b_F(t)-lambda>0. The stationary minus fresh extinction
      probability is at least
      (exp(-a_i*T)-exp(-2*a_i*T))*exp(-2*lambda*T)
      *(1-exp(-int_0^T d(t)dt))*(1-a_max/b_minus)>0.
    proof_identity: 'Classical branching birth-rate coupling plus a strictly positive separating event; a consequence for the corrected source model, not a new coupling principle.'
