  full_text: 'https://link.springer.com/article/10.1007/s11721-025-00248-z'
  critical_locators:
    - 'Section 1.1: redraws after every opinion update, including unchanged opinion.'
    - 'Section 3, preamble: quality T is mean holding time, realised holding time is Exp(1/T).'
    - 'Equations (5)-(6): the rate distribution G_B and harmonic mean lambda are equilibrium quantities.'
    - 'Conjecture 2: initial T_A and T_B sampled as above (fresh, not equilibrium rate law).'
