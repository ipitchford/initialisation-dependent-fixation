target_id: noisy-weighted-voter-fresh-resident-fixation
search_date: 2026-10-19
intended_contribution_unit: theorem
claim:
  exact_statement: |
    Fix a>0, 0<a<b_minus<=b_plus<infinity, two probability laws F and nu
    supported on [b_minus,b_plus], and an integer k>=1. On the complete
    graph K_N without self-neighbours, N>k vertices hold opinions A or B.
    A vertices update at constant rate a; a B vertex currently carrying rate
    r updates at rate r. At each update the vertex copies a uniformly chosen
    different vertex. If its copied opinion is B it independently redraws its
    rate from F, including when its opinion remains B. If its copied opinion
    is A its rate becomes a. Initially k vertices are A and the remaining
    rates are independent with law nu. Let alpha_k(N;nu) be the probability
    of eventual all-A consensus. Let R(t) be the autonomous resident reset
    chain with generator Lf(r)=r(int f(s)F(ds)-f(r)) and R(0)~nu.
    Put b_nu(t)=E[R(t)], A_nu(t)=int_0^t(b_nu(s)-a)ds and
    c_nu=[1+a int_0^infinity exp(-A_nu(t))dt]^{-1}.
    Then lim_{N->infinity}alpha_k(N;nu)=1-(1-c_nu)^k.
    For stationary initial law mu(dr)=lambda F(dr)/r, with
    lambda=[int r^{-1}F(dr)]^{-1}, this equals 1-(a/lambda)^k.
    For fresh initial law nu=F and nondegenerate F, the limit is strictly
    greater than 1-(a/lambda)^k. This disproves Conjecture 2 of the source
    under its explicit fresh-initialisation convention.
  exclusions:
    - Does not establish a fixation-limit theorem for arbitrary favourable-rate laws beyond finite separated-support mixtures.
    - Does not handle overlapping A and B rate supports in the fixation-limit proof.
    - Does not claim a new formula for time-inhomogeneous birth-death survival.
    - Does not claim first discovery that age structure affects fixation.
    - Does not treat numerical simulation as proof of the infinite-population limit.
